      <stop offset="0" stop-color="#121a22"/><stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.22"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="316" rx="18"/></clipPath>
    <clipPath id="shot"><rect x="24" y="26" width="240" height="135" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="316" fill="url(#bg)"/>
