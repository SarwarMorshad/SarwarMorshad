  <text x="24" y="192" font-size="14.5" fill="#aab6c0">A React Native app that prints receipts directly to an Epson TM-T20III</text>
  <text x="24" y="213" font-size="14.5" fill="#aab6c0">thermal printer. It's in daily use at Bocado Berlin.</text>
  <g transform="translate(24 268)"><rect width="110.80000000000001" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="55.400000000000006" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">React Native</text></g>
