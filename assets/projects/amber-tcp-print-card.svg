  <rect x="0.5" y="0.5" width="599" height="315" rx="17.5" fill="none" stroke="#ffffff1c"/>
  <image href="data:image/jpeg;base64," x="24" y="26" width="240" height="135" clip-path="url(#shot)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="24.5" y="26.5" width="239" height="134" rx="11.5" fill="none" stroke="#ffffff26"/>

  <text x="288" y="50" font-size="12" font-weight="600" letter-spacing="1.6" fill="#ffd166">MOBILE APP AND HARDWARE</text>
  <text x="288" y="84" font-size="26" font-weight="700" fill="#f3f6f8">Amber TCP Print App</text>
  <g transform="translate(288 136)">
