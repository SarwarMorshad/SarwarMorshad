  <g transform="translate(202.4 268)"><rect width="73.80000000000001" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="36.900000000000006" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">Node.js</text></g>
  <g transform="translate(284.20000000000005 268)"><rect width="103.4" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="51.7" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">TCP sockets</text></g>
  <g transform="translate(395.6 268)"><rect width="73.80000000000001" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="36.900000000000006" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">ESC/POS</text></g>
