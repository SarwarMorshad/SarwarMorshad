<svg xmlns="http://www.w3.org/2000/svg" width="600" height="352" viewBox="0 0 600 352" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a22"/><stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ff7a7a" stop-opacity="0.22"/><stop offset="1" stop-color="#ff7a7a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><path d="M0 18 Q0 0 18 0 H582 Q600 0 600 18 V352 H0 Z"/></clipPath>
    <clipPath id="shot"><rect x="24" y="26" width="240" height="135" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="352" fill="url(#bg)"/>
    <rect width="600" height="352" fill="url(#glow)"/>
    <rect width="600" height="3" fill="#ff7a7a"/>
  </g>
  <path d="M0.5 352 V18 Q0.5 0.5 18 0.5 H582 Q599.5 0.5 599.5 18 V352" fill="none" stroke="#ffffff1c"/>
  <!-- The footer bar: a darker tray, labelled, that the buttons below hang from. -->
  <rect y="316" width="600" height="36" fill="#070b0f" clip-path="url(#card)"/>
  <rect y="316" width="600" height="1" fill="#ff7a7a" fill-opacity="0.35"/>
  <text x="300" y="339" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="3" fill="#ff7a7a">▾  PROJECT LINKS  ▾</text>
  <rect y="349" width="600" height="3" fill="#ff7a7a"/>
  <image href="data:image/jpeg;base64," x="24" y="26" width="240" height="135" clip-path="url(#shot)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="24.5" y="26.5" width="239" height="134" rx="11.5" fill="none" stroke="#ffffff26"/>

  <text x="288" y="50" font-size="12" font-weight="600" letter-spacing="1.6" fill="#ff7a7a">MOVIE DISCOVERY PLATFORM</text>
  <text x="288" y="84" font-size="26" font-weight="700" fill="#f3f6f8">Movie Matrix</text>
  <g transform="translate(288 136)">
    <circle cx="6" cy="0" r="4.5" fill="#22c55e"/>
    <circle cx="6" cy="0" r="8" fill="#22c55e" fill-opacity="0.2"/>
    <text x="20" y="4.5" font-size="13" font-weight="600" fill="#e2e8ec">Live</text>
    <text x="64.4" y="4.5" font-size="13" fill="#8a97a3">·  Open source</text>
  </g>

  <text x="24" y="192" font-size="14.5" fill="#aab6c0">A full-stack movie discovery platform where people explore films, review</text>
  <text x="24" y="213" font-size="14.5" fill="#aab6c0">them, and keep their own collection and watchlist.</text>
  <g transform="translate(24 268)"><rect width="81.2" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="40.6" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">React 19</text></g>
  <g transform="translate(113.2 268)"><rect width="51.6" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="25.8" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">Vite</text></g>
  <g transform="translate(172.8 268)"><rect width="110.80000000000001" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="55.400000000000006" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">Tailwind CSS</text></g>
  <g transform="translate(291.6 268)"><rect width="73.80000000000001" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="36.900000000000006" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">DaisyUI</text></g>
  <g transform="translate(373.40000000000003 268)"><rect width="118.2" height="26" rx="13" fill="#ffffff0d" stroke="#ffffff1f"/><text x="59.1" y="17.5" text-anchor="middle" font-size="12.5" fill="#c9d4dc">Framer Motion</text></g>
