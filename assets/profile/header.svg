<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a22"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
    <radialGradient id="glow" cx="0.05" cy="0" r="0.75"><stop offset="0" stop-color="#70c8c4" stop-opacity="0.18"/><stop offset="1" stop-color="#70c8c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.6"><stop offset="0" stop-color="#ff3b30" stop-opacity="0.14"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#70c8c4"/><stop offset="1" stop-color="#ff3b30"/></linearGradient>
    <radialGradient id="reality" cx="0.3" cy="0.3" r="0.8"><stop offset="0" stop-color="#e2fffc"/><stop offset="0.45" stop-color="#70c8c4"/><stop offset="1" stop-color="#0d3a40"/></radialGradient>
    <radialGradient id="other" cx="0.7" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffb3a8"/><stop offset="0.45" stop-color="#f5222d"/><stop offset="1" stop-color="#3d0508"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#glow)"/><rect width="1200" height="300" fill="url(#glow2)"/>
    <rect width="1200" height="3" fill="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#ffffff1c"/>
  
  <text x="56" y="78" font-size="15" font-weight="700" letter-spacing="3" fill="#70c8c4">FULL-STACK DEVELOPER  ·  BERLIN, GERMANY</text>
  <text x="54" y="146" font-size="64" font-weight="800" fill="#f3f6f8">Sarwar Morshad</text>
  <text x="56" y="190" font-size="21" fill="#aab6c0">I build web, mobile, 3D and AI products, from the first</text>
  <text x="56" y="218" font-size="21" fill="#aab6c0">requirement to production and support after launch.</text>
  <g transform="translate(56 244)">
