    <circle cx="20" cy="17" r="5" fill="#22c55e"/><circle cx="20" cy="17" r="9" fill="#22c55e" fill-opacity="0.25"/>
    <text x="36" y="22.5" font-size="15" font-weight="700" fill="#d9f8e3">Open to full-stack roles</text>
  </g>
  
  <defs><clipPath id="orb"><circle cx="1010" cy="150" r="92"/></clipPath>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <circle cx="980" cy="150" r="92" fill="#70c8c4" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1040" cy="150" r="92" fill="#ff3b30" opacity="0.18" filter="url(#soft)"/>
  <g clip-path="url(#orb)">
    <rect x="918" y="58" width="184" height="184" fill="url(#other)"/>
    <polygon points="908,48 1018,54 996,98 1022,132 994,172 1018,208 1000,246 908,252" fill="url(#reality)"/>
    <polyline points="1018,54 996,98 1022,132 994,172 1018,208 1000,246" fill="none" stroke="#fff6e8" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <circle cx="1010" cy="150" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
